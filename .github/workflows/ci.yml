name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# WHY: a newer push to the same ref makes the older run pointless (R1-13).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run tokens:check
      - run: npm test
      # WHY: next/font/google downloads the fonts at build time (`next build`) and on first request (`next dev`, used by e2e), so both need network access.
      - run: npm run build
      # WHY: headless Chromium against `next dev` (the /dev galleries only exist there); no secrets needed.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # actions/upload-artifact v7 is the latest major as of 2026-11-03 (GitHub releases API).
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore

  # WHY: security invariants (plan §6) run against a throwaway local Postgres built from the
  # migrations, so a failing test blocks the PR (CLAUDE.md "Testing & definition of done"). The
  # runner has Docker; no secrets and no hosted project are involved.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx supabase db start
      # WHY: reset applies every migration in order, then seed.sql, exactly as a fresh developer would.
      - run: npx supabase db reset
      - run: npx supabase test db
      # WHY: skipped until the types file exists (it is generated after the first applied migration).
      # Uses --db-url because only the database container is running here, not the whole stack.
      - name: Types drift check
        if: ${{ hashFiles('lib/supabase/database.types.ts') != '' }}
        run: |
          npx supabase gen types typescript --db-url postgresql://postgres:postgres@127.0.0.1:54322/postgres --schema public > "$RUNNER_TEMP/database.types.ts"
          diff -u lib/supabase/database.types.ts "$RUNNER_TEMP/database.types.ts"
